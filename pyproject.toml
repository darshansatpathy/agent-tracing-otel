[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tracing-otel"
version = "0.1.0"
description = "OpenTelemetry tracing for agent runs with cost per completed task: GenAI semantic conventions, a Collector pipeline to Langfuse and Tempo, Prometheus rules and Grafana dashboards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
dependencies = [
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-semantic-conventions>=0.51b0",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.30"]
httpx = ["httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "types-PyYAML", "opentelemetry-exporter-otlp-proto-http>=1.30"]

[project.scripts]
agenttrace = "agenttrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
max-line-length = 190

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agenttrace"]
