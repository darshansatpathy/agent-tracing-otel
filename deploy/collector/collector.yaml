# OpenTelemetry Collector: traces to Tempo (tail-sampled), metrics to Prometheus (never sampled).
# Add deploy/collector/langfuse.yaml as a second --config to also send traces to Langfuse.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Prompt and completion text never leaves the collector, even if an app turned capture on by mistake.
  attributes/drop_content:
    actions:
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.system_instructions, action: delete}

  # Keep every failed, slow or expensive task; sample the rest. Metrics come from the SDK, so cost and
  # token totals stay exact whatever is sampled here.
  tail_sampling:
    decision_wait: 30s
    num_traces: 100000
    policies:
      - name: errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: not-completed
        type: string_attribute
        string_attribute: {key: agent.task.outcome, values: [failure, escalated, abandoned]}
      - name: slow
        type: latency
        latency: {threshold_ms: 60000}
      - name: expensive
        type: numeric_attribute
        numeric_attribute: {key: agent.task.cost_usd, min_value: 0.10, max_value: 1000000}
      - name: sample-the-rest
        type: probabilistic
        probabilistic: {sampling_percentage: 20}

  batch:
    send_batch_size: 2048
    timeout: 5s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true   # exemplars link metric points to traces
    resource_to_telemetry_conversion: {enabled: false}
  debug:
    verbosity: basic

extensions:
  health_check: {endpoint: 0.0.0.0:13133}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop_content, tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
