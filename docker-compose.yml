# The whole pipeline locally: Collector → Tempo (traces) and Prometheus (metrics) → Grafana on :3000.
#   docker compose up -d
#   agenttrace simulate --tasks 2000 --otlp http://localhost:4318
# To add Langfuse, set LANGFUSE_OTLP_ENDPOINT and LANGFUSE_AUTH and use the langfuse overlay:
#   COLLECTOR_CONFIGS="--config=/etc/otelcol/collector.yaml --config=/etc/otelcol/langfuse.yaml" docker compose up -d
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ${COLLECTOR_CONFIGS:---config=/etc/otelcol/collector.yaml}
    environment:
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-}
      LANGFUSE_AUTH: ${LANGFUSE_AUTH:-}
    volumes: ["./deploy/collector:/etc/otelcol:ro"]
    ports: ["4317:4317", "4318:4318", "8889:8889"]
  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro"]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--enable-feature=exemplar-storage"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
